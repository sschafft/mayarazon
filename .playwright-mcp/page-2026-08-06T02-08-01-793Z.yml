      - paragraph [ref=f2e39]: I helped found The Google School for Leaders, Google's global executive development function, where I've built programs, partnerships, and learning environments that have reached more than 10,000 leaders worldwide. I led the space and experience strategy for The Schoolhouse, Google's first purpose-built learning campus, and took Google's management development public for the first time through a course now available in Grow with Google.
      - paragraph [ref=f2e40]: Before Google, I spent several years running my own consultancy, advising leaders at companies from Airbnb to Genentech — and before that, leading HR and Stores Learning & Development at Jamba Juice. I trained as a social worker and a cultural anthropologist, which still shapes how I think about people, culture, and change.
