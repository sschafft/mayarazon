<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fdfdfb;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #3b5bdb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --fg: #f2f2f0;
        --muted: #9a9a96;
        --accent: #8ea3ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { text-align: center; max-width: 32rem; }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
    a { color: var(--accent); }
    footer {
      position: fixed;
      bottom: 1.25rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World! 👋</h1>
    <p>This site is live on GitHub Pages.</p>
  </main>
  <footer>mayarazon</footer>
</body>
</html>
